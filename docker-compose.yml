services:
  app:
    build: .
    ports:
      - "3847:3847"
    environment:
      SMS_DATA_DIR: /data
      SMS_HOST: 0.0.0.0
      SMS_PORT: "3847"
      SMS_SESSION_SECRET: ${SMS_SESSION_SECRET:-dev-change-me-session-secret}
      SMS_DEMO: ${SMS_DEMO:-0}
    volumes:
      - ./.data:/data
    restart: unless-stopped
