services:
  app:
    image: promptstack-sms:latest
    container_name: promptstack-sms
    ports:
      - "3847:3847"
    env_file:
      - ${SMS_ENV_FILE:-C:/ProgramData/PromptstackSMS/.env}
    environment:
      SMS_DATA_DIR: /data
      SMS_HOST: 0.0.0.0
      SMS_PORT: "3847"
      SMS_DEMO: ${SMS_DEMO:-0}
    volumes:
      - ${SMS_DATA_DIR:-C:/ProgramData/PromptstackSMS}:/data
    restart: unless-stopped
